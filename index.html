<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A5C9E">
<title>סיור ליקויים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F3;
  --surface:#FFFFFF;
  --ink:#101E28;
  --ink2:#5B6B75;
  --line:#D3DBE0;
  --action:#0A5C9E;
  --action-dark:#06416F;
  --sev1:#C22B1B;
  --sev2:#D98A0B;
  --sev3:#3F7357;
  --radius:10px;
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Assistant',system-ui,'Segoe UI',Roboto,sans-serif;
  font-size:17px;
  line-height:1.5;
  padding-bottom:96px;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--action);color:#fff;
  padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 1px 0 rgba(0,0,0,.15);
}
.topbar h1{font-size:19px;font-weight:800;margin:0;flex:1;letter-spacing:-.01em}
.topbar .count{
  background:rgba(255,255,255,.18);
  border-radius:999px;padding:2px 12px;font-weight:600;font-size:15px;
}
.netdot{width:9px;height:9px;border-radius:50%;background:#5BD07E}
.netdot.off{background:#F0B429}

/* ---------- tour header ---------- */
.tour{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px}
.tour summary{
  cursor:pointer;font-weight:600;color:var(--ink2);
  list-style:none;display:flex;justify-content:space-between;align-items:center;
}
.tour summary::-webkit-details-marker{display:none}
.tour summary::after{content:'▾';font-size:15px}
.tour[open] summary::after{content:'▴'}
.tour .fields{margin-top:12px;display:grid;gap:10px}

label{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:4px}
input[type=text],input[type=date],textarea,select{
  width:100%;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);padding:11px 12px;
}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--action);outline-offset:1px;border-color:var(--action)}

/* ---------- capture ---------- */
.capture{padding:16px 14px}
.shoot{
  width:100%;min-height:88px;
  background:var(--action);color:#fff;border:0;border-radius:14px;
  font-size:20px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:12px;
  box-shadow:0 3px 0 #06416F;
}
.shoot:active{transform:translateY(2px);box-shadow:0 1px 0 #06416F}
.shoot svg{width:30px;height:30px;fill:currentColor}
.hint{margin:10px 2px 0;font-size:14px;color:var(--ink2)}

/* ---------- list ---------- */
.list{padding:0 14px;display:grid;gap:12px}
.empty{
  border:1px dashed var(--line);border-radius:var(--radius);
  padding:26px 18px;text-align:center;color:var(--ink2);background:#fff;
}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:grid;grid-template-columns:6px 88px 1fr;
}
.card .bar{background:var(--sev3)}
.card[data-sev="מיידי"] .bar{background:var(--sev1)}
.card[data-sev="דחוף"] .bar{background:var(--sev2)}
.card .thumb{width:88px;height:100%;min-height:92px;object-fit:cover;display:block;background:#DDE3E7}
.card .body{padding:10px 12px;min-width:0}
.card .seq{font-weight:800;color:var(--ink2);font-size:14px}
.card .loc{font-weight:800;margin:0 0 2px}
.card .desc{
  margin:0;color:var(--ink2);font-size:15px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card .meta{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.card .acts{margin-top:8px;display:flex;gap:14px}
.card .acts button{background:none;border:0;padding:4px 0;font-weight:600;color:var(--action)}
.card .acts button.del{color:var(--sev1)}

/* ---------- bottom bar ---------- */
.bottom{
  position:fixed;bottom:0;right:0;left:0;z-index:20;
  background:var(--surface);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:10px;
}
.bottom button{
  flex:1;min-height:var(--tap);border-radius:var(--radius);border:1px solid var(--action);
  background:#fff;color:var(--action);font-weight:800;
}
.bottom button.primary{background:var(--action);color:#fff}
.bottom button:disabled{opacity:.45}

/* ---------- sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:40;background:rgba(16,30,40,.55);
  display:none;align-items:flex-end;
}
.sheet.open{display:flex}
.sheet .panel{
  background:var(--bg);width:100%;max-height:94vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
}
.sheet h2{margin:2px 0 12px;font-size:20px}
.preview{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.preview img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.preview button{
  width:96px;height:96px;flex:none;border:1px dashed var(--line);background:#fff;
  border-radius:8px;color:var(--action);font-weight:700;
}
.chips{display:flex;gap:8px}
.chips button{
  flex:1;min-height:48px;border-radius:var(--radius);border:1px solid var(--line);
  background:#fff;font-weight:700;
}
.chips button[aria-pressed=true]{color:#fff;border-color:transparent}
.chips button[data-sev="מיידי"][aria-pressed=true]{background:var(--sev1)}
.chips button[data-sev="דחוף"][aria-pressed=true]{background:var(--sev2)}
.chips button[data-sev="שוטף"][aria-pressed=true]{background:var(--sev3)}
.sheet .row{display:grid;gap:10px;margin-bottom:12px}
.sheet .save{
  width:100%;min-height:var(--tap);border:0;border-radius:var(--radius);
  background:var(--action);color:#fff;font-weight:800;font-size:18px;margin-top:4px;
}
.sheet .cancel{
  width:100%;min-height:48px;border:0;background:none;color:var(--ink2);
  font-weight:600;margin-top:8px;
}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:96px;right:14px;left:14px;z-index:60;
  background:var(--ink);color:#fff;border-radius:var(--radius);
  padding:12px 14px;text-align:center;font-weight:600;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s;
}
.toast.show{opacity:1;transform:none}

/* ---------- report (rendered to PDF) ---------- */
#report{position:fixed;right:-99999px;top:0;width:794px;background:#fff}
.rep{padding:34px 40px;font-family:'Assistant',system-ui,sans-serif;color:#101E28}
.rep-head{border-bottom:3px solid #0A5C9E;padding-bottom:14px;margin-bottom:20px}
.rep-head h1{margin:0 0 6px;font-size:28px}
.rep-head .sub{color:#5B6B75;font-size:15px;line-height:1.8}
.rep-item{
  border:1px solid #D3DBE0;border-right:6px solid #3F7357;border-radius:8px;
  padding:14px 16px;margin-bottom:14px;page-break-inside:avoid;
}
.rep-item[data-sev="מיידי"]{border-right-color:#C22B1B}
.rep-item[data-sev="דחוף"]{border-right-color:#D98A0B}
.rep-item h3{margin:0 0 4px;font-size:19px}
.rep-item .tags{color:#5B6B75;font-size:14px;margin-bottom:8px}
.rep-item p{margin:0 0 10px;font-size:16px;line-height:1.6}
.rep-imgs{display:flex;gap:8px;flex-wrap:wrap}
.rep-imgs img{width:220px;height:165px;object-fit:cover;border-radius:6px;border:1px solid #D3DBE0}
.rep-foot{margin-top:18px;padding-top:12px;border-top:1px solid #D3DBE0;color:#5B6B75;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <span class="netdot" id="netdot" title="חיבור"></span>
  <h1>סיור ליקויים</h1>
  <span class="count" id="count">0</span>
</div>

<details class="tour" id="tourBox">
  <summary>פרטי הסיור</summary>
  <div class="fields">
    <div><label for="fBuilding">בניין / כתובת</label><input type="text" id="fBuilding" placeholder="לדוגמה: הרצל 14, ראש העין"></div>
    <div><label for="fClient">לקוח / ועד בית</label><input type="text" id="fClient" placeholder="שם הלקוח"></div>
    <div><label for="fInspector">שם הבודק</label><input type="text" id="fInspector" placeholder="דוד"></div>
    <div><label for="fDate">תאריך הסיור</label><input type="date" id="fDate"></div>
  </div>
</details>

<div class="capture">
  <button class="shoot" id="btnShoot">
    <svg viewBox="0 0 24 24"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3zm3 5.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11m0 2a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7"/></svg>
    צלם ליקוי
  </button>
  <p class="hint">כל ליקוי נשמר במכשיר מיד. אפשר לעבוד בלי רשת ולהפיק את הדוח בסוף.</p>
</div>

<div class="list" id="list"></div>

<div class="bottom">
  <button class="primary" id="btnPdf" disabled>צור PDF ושתף</button>
  <button id="btnText" disabled>סיכום לוואטסאפ</button>
  <button id="btnNew">סיור חדש</button>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2 id="sheetTitle">ליקוי חדש</h2>
    <div class="preview" id="preview"></div>
    <div class="row">
      <div>
        <label for="fLoc">מיקום</label>
        <input type="text" id="fLoc" list="locList" placeholder="חדר מדרגות, קומה 3">
        <datalist id="locList">
          <option value="לובי"></option><option value="חדר מדרגות"></option>
          <option value="חניון"></option><option value="גג"></option>
          <option value="מעלית"></option><option value="חדר אשפה"></option>
          <option value="חדר חשמל"></option><option value="חצר"></option>
        </datalist>
      </div>
      <div>
        <label for="fDesc">תיאור הליקוי</label>
        <textarea id="fDesc" placeholder="מנורת LED בתקרת חדר המדרגות שרופה, גוף התאורה תלוי"></textarea>
      </div>
      <div>
        <label>דחיפות</label>
        <div class="chips" id="sevChips">
          <button type="button" data-sev="מיידי" aria-pressed="false">מיידי</button>
          <button type="button" data-sev="דחוף" aria-pressed="false">דחוף</button>
          <button type="button" data-sev="שוטף" aria-pressed="true">שוטף</button>
        </div>
      </div>
      <div>
        <label for="fTrade">בעל מקצוע נדרש</label>
        <select id="fTrade">
          <option>חשמלאי</option><option>אינסטלטור</option><option>מסגר</option>
          <option>מנעולן</option><option>שיפוצים</option><option>טכנאי מעליות</option>
          <option>ניקיון</option><option>גינון</option><option>לא נדרש / לבירור</option>
        </select>
      </div>
    </div>
    <button class="save" id="btnSave">שמור והמשך</button>
    <button class="cancel" id="btnCancel">ביטול</button>
  </div>
</div>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<div class="toast" id="toast"></div>
<div id="report"></div>

<script>
/* ============ state ============ */
const MAX_SIDE = 1400, JPEG_Q = 0.72;
const SEVS = ['מיידי','דחוף','שוטף'];
let db, defects = [], draft = null, editingId = null;

const $ = id => document.getElementById(id);
const toastEl = $('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}

/* ============ IndexedDB ============ */
function openDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open('defectTourDB', 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('defects')) d.createObjectStore('defects',{keyPath:'id'});
      if(!d.objectStoreNames.contains('meta'))    d.createObjectStore('meta',{keyPath:'key'});
    };
    req.onsuccess = ()=>res(req.result);
    req.onerror   = ()=>rej(req.error);
  });
}
function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
function put(store, val){
  return new Promise((res,rej)=>{ const r = tx(store,'readwrite').put(val); r.onsuccess=res; r.onerror=()=>rej(r.error); });
}
function delRec(store, key){
  return new Promise((res,rej)=>{ const r = tx(store,'readwrite').delete(key); r.onsuccess=res; r.onerror=()=>rej(r.error); });
}
function getAll(store){
  return new Promise((res,rej)=>{ const r = tx(store,'readonly').getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
function getOne(store, key){
  return new Promise((res,rej)=>{ const r = tx(store,'readonly').get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
function clearStore(store){
  return new Promise((res,rej)=>{ const r = tx(store,'readwrite').clear(); r.onsuccess=res; r.onerror=()=>rej(r.error); });
}

/* ============ image compression ============ */
async function compress(file){
  const bmp = await createImageBitmap(file, {imageOrientation:'from-image'});
  const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  bmp.close();
  return new Promise(r => cv.toBlob(r, 'image/jpeg', JPEG_Q));
}

/* ============ tour meta ============ */
const metaFields = {building:'fBuilding', client:'fClient', inspector:'fInspector', date:'fDate'};
async function loadMeta(){
  const m = await getOne('meta','tour');
  const data = (m && m.value) || {};
  for(const k in metaFields) $(metaFields[k]).value = data[k] || '';
  if(!$('fDate').value) $('fDate').value = new Date().toISOString().slice(0,10);
}
async function saveMeta(){
  const value = {};
  for(const k in metaFields) value[k] = $(metaFields[k]).value.trim();
  await put('meta',{key:'tour', value});
}
Object.values(metaFields).forEach(id => $(id).addEventListener('change', saveMeta));

/* ============ camera + draft ============ */
$('btnShoot').addEventListener('click', ()=>{ draft = null; editingId = null; $('camIn').click(); });

$('camIn').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const blob = await compress(file);
  if(draft){ draft.photos.push(blob); renderPreview(); return; }
  draft = {id:'d_'+Date.now(), photos:[blob], location:'', description:'', severity:'שוטף', trade:'חשמלאי'};
  openSheet('ליקוי חדש');
});

function openSheet(title){
  $('sheetTitle').textContent = title;
  $('fLoc').value  = draft.location;
  $('fDesc').value = draft.description;
  $('fTrade').value = draft.trade;
  setSev(draft.severity);
  renderPreview();
  $('sheet').classList.add('open');
  setTimeout(()=>$('fLoc').focus(), 120);
}
function closeSheet(){ $('sheet').classList.remove('open'); draft = null; editingId = null; }

function renderPreview(){
  const box = $('preview');
  box.innerHTML = '';
  draft.photos.forEach((b,i)=>{
    const img = new Image();
    img.src = URL.createObjectURL(b);
    img.onload = ()=>URL.revokeObjectURL(img.src);
    img.addEventListener('click', ()=>{
      if(draft.photos.length === 1) return toast('חייבת להישאר תמונה אחת');
      draft.photos.splice(i,1); renderPreview();
    });
    box.appendChild(img);
  });
  const add = document.createElement('button');
  add.type = 'button'; add.textContent = '+ תמונה';
  add.addEventListener('click', ()=>$('camIn').click());
  box.appendChild(add);
}

function setSev(v){
  [...$('sevChips').children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sev === v)));
}
$('sevChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if(b) setSev(b.dataset.sev);
});
function currentSev(){
  const on = [...$('sevChips').children].find(b => b.getAttribute('aria-pressed') === 'true');
  return on ? on.dataset.sev : 'שוטף';
}

$('btnCancel').addEventListener('click', closeSheet);

$('btnSave').addEventListener('click', async ()=>{
  const desc = $('fDesc').value.trim();
  if(!desc) return toast('חסר תיאור הליקוי');
  const rec = {
    id: draft.id,
    photos: draft.photos,
    location: $('fLoc').value.trim() || 'לא צוין',
    description: desc,
    severity: currentSev(),
    trade: $('fTrade').value,
    createdAt: draft.createdAt || Date.now()
  };
  await put('defects', rec);
  closeSheet();
  await refresh();
  toast('נשמר במכשיר');
});

/* ============ list ============ */
async function refresh(){
  defects = (await getAll('defects')).sort((a,b)=>a.createdAt-b.createdAt);
  $('count').textContent = defects.length;
  $('btnPdf').disabled = $('btnText').disabled = defects.length === 0;

  const list = $('list');
  list.innerHTML = '';
  if(!defects.length){
    list.innerHTML = '<div class="empty">אין ליקויים בסיור הזה. לחץ על "צלם ליקוי" כדי להתחיל.</div>';
    return;
  }
  defects.forEach((d,i)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.sev = d.severity;
    card.innerHTML =
      '<div class="bar"></div>' +
      '<img class="thumb" alt="">' +
      '<div class="body">' +
        '<div class="seq">ליקוי ' + (i+1) + (d.photos.length>1 ? ' · '+d.photos.length+' תמונות' : '') + '</div>' +
        '<p class="loc"></p><p class="desc"></p>' +
        '<div class="meta"><span class="sev"></span><span class="trade"></span></div>' +
        '<div class="acts"><button class="edit">עריכה</button><button class="del">מחיקה</button></div>' +
      '</div>';
    const img = card.querySelector('.thumb');
    img.src = URL.createObjectURL(d.photos[0]);
    img.onload = ()=>URL.revokeObjectURL(img.src);
    card.querySelector('.loc').textContent   = d.location;
    card.querySelector('.desc').textContent  = d.description;
    card.querySelector('.sev').textContent   = 'דחיפות: ' + d.severity;
    card.querySelector('.trade').textContent = '· ' + d.trade;
    card.querySelector('.edit').addEventListener('click', ()=>{
      draft = {id:d.id, photos:d.photos.slice(), location:d.location, description:d.description,
               severity:d.severity, trade:d.trade, createdAt:d.createdAt};
      openSheet('עריכת ליקוי ' + (i+1));
    });
    card.querySelector('.del').addEventListener('click', async ()=>{
      if(!confirm('למחוק את ליקוי ' + (i+1) + '?')) return;
      await delRec('defects', d.id);
      await refresh();
    });
    list.appendChild(card);
  });
}

/* ============ report ============ */
function metaNow(){
  return {
    building: $('fBuilding').value.trim() || 'בניין ללא שם',
    client:   $('fClient').value.trim(),
    inspector:$('fInspector').value.trim(),
    date:     $('fDate').value
  };
}
function heDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return d + '/' + m + '/' + y;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function buildReportHTML(){
  const m = metaNow();
  const urls = [];
  let items = '';
  defects.forEach((d,i)=>{
    let imgs = '';
    d.photos.forEach(b=>{
      const u = URL.createObjectURL(b);
      urls.push(u);
      imgs += '<img src="' + u + '" alt="">';
    });
    items +=
      '<div class="rep-item" data-sev="' + esc(d.severity) + '">' +
        '<h3>' + (i+1) + '. ' + esc(d.location) + '</h3>' +
        '<div class="tags">דחיפות: ' + esc(d.severity) + ' &nbsp;|&nbsp; בעל מקצוע: ' + esc(d.trade) + '</div>' +
        '<p>' + esc(d.description) + '</p>' +
        '<div class="rep-imgs">' + imgs + '</div>' +
      '</div>';
  });
  const counts = SEVS.map(s => s + ': ' + defects.filter(d=>d.severity===s).length).join(' | ');
  $('report').innerHTML =
    '<div class="rep">' +
      '<div class="rep-head">' +
        '<h1>דוח ליקויים — ' + esc(m.building) + '</h1>' +
        '<div class="sub">' +
          (m.client ? 'לקוח: ' + esc(m.client) + '<br>' : '') +
          'תאריך סיור: ' + heDate(m.date) + '<br>' +
          'סה"כ ליקויים: ' + defects.length + ' (' + counts + ')' +
          (m.inspector ? '<br>נבדק על ידי: ' + esc(m.inspector) : '') +
        '</div>' +
      '</div>' + items +
      '<div class="rep-foot">הדוח הופק אוטומטית ממערכת סיורי ליקויים.</div>' +
    '</div>';
  await new Promise(r => setTimeout(r, 60));
  return urls;
}

function loadHtml2Pdf(){
  if(window.html2pdf) return Promise.resolve();
  const srcs = [
    'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.12.1/html2pdf.bundle.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'
  ];
  return new Promise((res,rej)=>{
    let i = 0;
    (function tryNext(){
      if(i >= srcs.length) return rej(new Error('no cdn'));
      const s = document.createElement('script');
      s.src = srcs[i++];
      s.onload = res;
      s.onerror = tryNext;
      document.head.appendChild(s);
    })();
  });
}

$('btnPdf').addEventListener('click', async ()=>{
  const btn = $('btnPdf'), old = btn.textContent;
  btn.disabled = true; btn.textContent = 'מייצר...';
  let urls = [];
  try{
    await loadHtml2Pdf();
    urls = await buildReportHTML();
    const m = metaNow();
    const name = 'דוח ליקויים - ' + m.building + ' - ' + heDate(m.date).replace(/\//g,'.') + '.pdf';
    const blob = await html2pdf().set({
      margin: [10,8,12,8],
      image: {type:'jpeg', quality:0.85},
      html2canvas: {scale:1.6, useCORS:true, backgroundColor:'#ffffff'},
      jsPDF: {unit:'mm', format:'a4', orientation:'portrait'},
      pagebreak: {mode:['css','legacy'], avoid:'.rep-item'}
    }).from($('report').firstElementChild).outputPdf('blob');

    const file = new File([blob], name, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'דוח ליקויים'});
    }else{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      toast('הדוח ירד לתיקיית ההורדות');
    }
  }catch(err){
    if(err && err.name === 'AbortError'){ /* המשתמש סגר את מגש השיתוף */ }
    else{ console.error(err); toast('הפקת הדוח נכשלה — בדוק חיבור לרשת'); }
  }finally{
    urls.forEach(URL.revokeObjectURL);
    $('report').innerHTML = '';
    btn.disabled = false; btn.textContent = old;
  }
});

$('btnText').addEventListener('click', ()=>{
  const m = metaNow();
  let t = 'דוח ליקויים — ' + m.building + '\n';
  if(m.client) t += 'לקוח: ' + m.client + '\n';
  t += 'תאריך: ' + heDate(m.date) + '\n';
  t += 'סה"כ ליקויים: ' + defects.length + '\n\n';
  defects.forEach((d,i)=>{
    t += (i+1) + '. ' + d.location + '\n' + d.description + '\n' +
         'דחיפות: ' + d.severity + ' | ' + d.trade + '\n\n';
  });
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
});

$('btnNew').addEventListener('click', async ()=>{
  if(defects.length && !confirm('לפתוח סיור חדש? ' + defects.length + ' הליקויים הנוכחיים יימחקו מהמכשיר.')) return;
  await clearStore('defects');
  await clearStore('meta');
  await loadMeta();
  await refresh();
  $('tourBox').open = true;
  toast('סיור חדש');
});

/* ============ boot ============ */
function netState(){ $('netdot').classList.toggle('off', !navigator.onLine); }
addEventListener('online', netState);
addEventListener('offline', netState);

(async function init(){
  try{
    db = await openDB();
  }catch(err){
    document.body.innerHTML =
      '<div style="padding:24px;font-family:sans-serif">האחסון במכשיר חסום. פתח את הדף מכתובת https ולא כקובץ מקומי.</div>';
    return;
  }
  netState();
  await loadMeta();
  await refresh();
  if(!$('fBuilding').value) $('tourBox').open = true;
})();
</script>
